<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graph Validator Chat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <button id="backButton" class="back-button" title="Click to go back, hold to go to Widget Showcase">←</button>
            <h1>Graph Validator Chat</h1>
            <div class="status" id="status">Initializing...</div>
        </header>
        
        <div class="chat-container">
            <div class="messages" id="messages">
                <div class="message bot">
                    <div class="message-content">
                        <strong>Bot:</strong> Analyzing your graph and triples...
                    </div>
                </div>
            </div>
            
            <div class="input-area">
                <input type="text" id="answerInput" placeholder="Type your answer here..." disabled>
                <button id="sendButton" disabled>Send</button>
            </div>
        </div>
        
        <div class="sidebar">
            <h3>Current Question</h3>
            <div id="currentQuestion" class="question-display">
                <p>Loading question...</p>
            </div>
            
            <h3>Graph State</h3>
            <div id="graphState" class="state-display">
                <p>Loading...</p>
            </div>
        </div>
    </div>
    
    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
