<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Triple & Entity Editor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Triple & Entity Editor</h1>
            <div class="stats" id="stats">
                <span>Triples: <strong id="triple-count">0</strong></span>
                <span>Entities: <strong id="entity-count">0</strong></span>
            </div>
        </header>

        <div class="main-content">
            <div class="sidebar">
                <div class="search-box">
                    <input type="text" id="search-input" placeholder="Search triples...">
                </div>
                <div class="filter-box">
                    <label>Filter by Label:</label>
                    <select id="label-filter">
                        <option value="">All Labels</option>
                    </select>
                </div>
                <div class="triple-list" id="triple-list">
                    <!-- Triples will be loaded here -->
                </div>
            </div>

            <div class="editor-panel" id="editor-panel">
                <div class="empty-state">
                    <p>Select a triple to edit</p>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
